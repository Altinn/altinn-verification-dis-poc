apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: verification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verification
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      containers:
        - name: verification
          image: verification:1
          # No probes: the app exposes no /health endpoints yet.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Demo service runs without a database: this only skips the EF
            # migrations at startup so the pod comes up clean. Wire real
            # connection strings in from a Secret before serving traffic.
            - name: PostgreSqlSettings__EnableDBConnection
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
